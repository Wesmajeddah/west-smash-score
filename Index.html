<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Smash Score</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        table {
            width: 90%;
            max-width: 700px;
            margin: 20px auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            font-size: 16px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        /* ഒന്നാം സ്ഥാനക്കാരെ സ്പെഷ്യൽ ആയി ഹൈലൈറ്റ് ചെയ്യാൻ */
        .rank-1 {
            background-color: #fff8dc !important;
            font-weight: bold;
        }
        .champion-tag {
            background-color: #ffd700;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-top: 5px;
        }
        .rank-2 {
            background-color: #f0f0f0 !important;
        }
        .rank-3 {
            background-color: #faebd7 !important;
        }
    </style>
</head>
<body>

    <h1>West Smash Scoreboard</h1>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player Name</th>
                <th>Total Play</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <!-- ഒന്നാം സ്ഥാനം -->
            <tr class="rank-1">
                <td>🥇 1st</td>
                <td>
                    നിങ്ങളുടെ പേര് / ടീം പേര്
                    <br><span class="champion-tag">🌟 അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് (Undefeated Champions)! 🌟</span>
                </td>
                <td>25</td>
                <td>1500</td>
            </tr>
            <!-- രണ്ടാം സ്ഥാനം -->
            <tr class="rank-2">
                <td>🥈 2nd</td>
                <td>രണ്ടാം സ്ഥാനക്കാരന്റെ പേര്</td>
                <td>22</td>
                <td>1350</td>
            </tr>
            <!-- മൂന്നാം സ്ഥാനം -->
            <tr class="rank-3">
                <td>🥉 3rd</td>
                <td>മൂന്നാം സ്ഥാനക്കാരന്റെ പേര്</td>
                <td>20</td>
                <td>1200</td>
            </tr>
            <!-- മറ്റ് കളിക്കാർ വേണമെങ്കിൽ ഇവിടെ ചേർക്കാം -->
        </tbody>
    </table>

</body>
</html>
