<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEST SMASH BADMINTON CLUB - Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font for Malayalam & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            font-family: 'Manjari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #F1C40F 40%, #B8860B 80%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .score-anim {
            animation: bounce 0.18s ease-out;
        }
        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 select-none">

    <div class="w-full max-w-sm sm:max-w-md my-auto space-y-3">
        
        <!-- Header with Club Logo and Name -->
        <div class="text-center py-3 px-3 bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 border gold-border rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="flex justify-center mb-1">
                <div class="w-20 h-20 sm:w-24 sm:h-24 relative drop-shadow-[0_4px_12px_rgba(212,175,55,0.4)]">
                    <svg viewBox="0 0 200 200" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="goldGrad" cx="50%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#FFE082" />
                                <stop offset="40%" stop-color="#D4AF37" />
                                <stop offset="85%" stop-color="#8B6508" />
                                <stop offset="100%" stop-color="#5B4000" />
                            </radialGradient>
                            <radialGradient id="bgBlue" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#1E3E62" />
                                <stop offset="100%" stop-color="#0B192C" />
                            </radialGradient>
                            <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFF59D" />
                                <stop offset="50%" stop-color="#D4AF37" />
                                <stop offset="100%" stop-color="#996515" />
                            </linearGradient>
                        </defs>

                        <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" />
                        <circle cx="100" cy="100" r="88" fill="url(#bgBlue)" stroke="url(#goldGrad)" stroke-width="2" />
                        <circle cx="100" cy="100" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />

                        <path id="textArcTop" d="M 22 100 A 78 78 0 0 1 178 100" fill="none" />
                        <text font-family="Cinzel, serif" font-weight="900" font-size="14" fill="#FFE082" letter-spacing="1.5">
                            <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">WEST SMASH</textPath>
                        </text>

                        <path id="textArcBottom" d="M 178 100 A 78 78 0 0 1 22 100" fill="none" />
                        <text font-family="Cinzel, serif" font-weight="800" font-size="11" fill="#FFE082" letter-spacing="1">
                            <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">BADMINTON CLUB</textPath>
                        </text>

                        <polygon points="25,100 28,96 32,100 28,104" fill="url(#goldLight)" />
                        <polygon points="175,100 172,96 168,100 172,104" fill="url(#goldLight)" />

                        <g transform="translate(0, -2)">
                            <path d="M 75 55 Q 88 42 98 55 Q 88 68 75 55 Z" fill="none" stroke="url(#goldLight)" stroke-width="2" />
                            <line x1="86.5" y1="61.5" x2="110" y2="85" stroke="url(#goldLight)" stroke-width="2" />
                            <path d="M 45 68 C 55 90 68 120 85 125 C 95 110 92 88 92 78 C 96 90 102 120 115 125 C 130 115 145 88 155 70 C 145 92 125 138 100 138 C 75 138 55 92 45 68 Z" fill="url(#goldGrad)" />
                            <g transform="translate(118, 52) rotate(25)">
                                <path d="M 0 0 Q 10 -15 22 -18 L 18 8 Z" fill="url(#goldLight)" opacity="0.9" />
                                <path d="M 0 0 Q 18 -5 26 8 L 12 14 Z" fill="url(#goldLight)" />
                                <ellipse cx="2" cy="2" rx="4" ry="5" fill="#FFF099" />
                            </g>
                        </g>

                        <line x1="62" y1="148" x2="80" y2="148" stroke="url(#goldLight)" stroke-width="1" />
                        <text x="100" y="151" font-family="Cinzel, serif" font-weight="700" font-size="8.5" fill="#FFF099" text-anchor="middle">SINCE 2026</text>
                        <line x1="120" y1="148" x2="138" y2="148" stroke="url(#goldLight)" stroke-width="1" />
                    </svg>
                </div>
            </div>

            <h1 class="text-lg sm:text-xl font-black font-cinzel gold-gradient-text tracking-wide leading-tight">WEST SMASH</h1>
            <h2 class="text-xs sm:text-sm font-bold font-cinzel text-amber-200/90 tracking-widest uppercase">BADMINTON CLUB</h2>
            <p class="text-[11px] text-slate-300 mt-1 font-semibold">ടൂർണമെന്റ് സ്കോർ കൗണ്ടർ</p>
        </div>

        <!-- Lock Control Toggle -->
        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs">
            <span class="text-slate-300 font-bold">സ്കോർ എഡിറ്റിംഗ് (Lock Edit):</span>
            <button id="lock-btn" onclick="toggleLock()" class="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-lg transition-all flex items-center gap-1">
                <i id="lock-icon" class="fa-solid fa-lock-open"></i> <span id="lock-text">അൺലോക്ക്ഡ്</span>
            </button>
        </div>

        <!-- Teams List -->
        <div id="teams-list" class="space-y-2.5">
            <!-- Rendered by JS -->
        </div>

        <!-- Total Games Played Today Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 flex items-center justify-between px-4 shadow-md">
            <span class="text-xs font-bold text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-amber-400"></i> അന്നേ ദിവസം ആകെ കളികൾ (Total Play):
            </span>
            <div class="flex items-center gap-2">
                <button onclick="changeTotalPlay(-1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-xs lock-target">-</button>
                <span id="total-play-val" class="text-amber-400 font-black text-base w-8 text-center">0</span>
                <button onclick="changeTotalPlay(1)" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-bold text-xs lock-target">+</button>
            </div>
        </div>

        <!-- Leader / Winner / Loser Summary Section -->
        <div class="bg-gradient-to-r from-amber-500/15 via-blue-900/40 to-amber-500/15 border gold-border rounded-2xl p-3 text-center shadow-lg space-y-2">
            <div>
                <div class="text-[11px] font-bold text-amber-300 uppercase tracking-wide flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-crown text-amber-400"></i> ഒന്നാം സ്ഥാനക്കാർ (Champions)
                </div>
                <div id="leader-text" class="text-sm sm:text-base font-black text-white mt-0.5">
                    ലോഡ് ചെയ്യുന്നു...
                </div>
            </div>

            <div id="podium-text" class="text-xs text-amber-200/80 font-medium pt-1 border-t border-amber-500/20">
                2-ാം സ്ഥാനം കണക്കാക്കുന്നു...
            </div>

            <!-- തോട്ട ടീം വിമർശന ഭാഗം -->
            <div id="loser-text" class="text-xs text-rose-300 font-semibold pt-1 border-t border-rose-500/20">
                തോട്ട ടീമിനെ കണ്ടെത്തുന്നു...
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="resetScores()" class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-slate-300 font-bold py-3 px-3 rounded-xl border border-slate-700/80 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 shadow-md lock-target">
                <i class="fa-solid fa-rotate-right text-slate-400"></i> റീസെറ്റ് (Reset)
            </button>
            <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-3 px-3 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 border border-emerald-400/30">
                <i class="fa-brands fa-whatsapp text-sm text-emerald-100"></i> വാട്സ്ആപ്പിൽ ഷെയർ
            </button>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        സ്കോർ കോപ്പി ചെയ്തു!
    </div>

    <script>
        const defaultTeams = [
            { id: 1, name: "Shafeer & Faisal", wins: 0, badgeBg: "bg-amber-500" },
            { id: 2, name: "Musthafa & Junaid", wins: 0, badgeBg: "bg-blue-600" },
            { id: 3, name: "Ashraf & Anwar", wins: 0, badgeBg: "bg-emerald-600" },
            { id: 4, name: "Aneesh & Anas", wins: 0, badgeBg: "bg-rose-600" },
            { id: 5, name: "Fahad & Mujeeb", wins: 0, badgeBg: "bg-purple-600" }
        ];

        let teams = [];
        let totalPlayCount = 0;
        let isLocked = false;

        const firebaseConfig = {
            databaseURL: "https://west-smash-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('west_smash_scores_v4');

        function initData() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    teams = data.teams || defaultTeams;
                    totalPlayCount = data.totalPlayCount || 0;
                    isLocked = data.isLocked || false;
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    totalPlayCount = 0;
                    isLocked = false;
                    dbRef.set({ teams, totalPlayCount, isLocked });
                }
                render();
            }, (error) => {
                console.error("Firebase read error:", error);
                const saved = localStorage.getItem("west_smash_scores_v4");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        teams = parsed.teams || defaultTeams;
                        totalPlayCount = parsed.totalPlayCount || 0;
                        isLocked = parsed.isLocked || false;
                    } catch(e) { 
                        teams = JSON.parse(JSON.stringify(defaultTeams)); 
                        totalPlayCount = 0;
                        isLocked = false;
                    }
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    totalPlayCount = 0;
                    isLocked = false;
                }
                render();
            });
        }

        function saveData() {
            dbRef.set({ teams, totalPlayCount, isLocked }).catch((error) => {
                console.error("Firebase write error:", error);
                localStorage.setItem("west_smash_scores_v4", JSON.stringify({ teams, totalPlayCount, isLocked }));
            });
            updateLeaderboard();
        }

        function toggleLock() {
            isLocked = !isLocked;
            saveData();
            render();
            showToast(isLocked ? "സ്കോർ എഡിറ്റിംഗ് ലോക്ക് ചെയ്തു!" : "സ്കോർ എഡിറ്റിംഗ് അൺലോക്ക് ചെയ്തു!");
        }

        function render() {
            const container = document.getElementById("teams-list");
            container.innerHTML = "";

            teams.forEach((team, idx) => {
                const card = document.createElement("div");
                card.className = "bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-2.5 flex items-center justify-between shadow-md gap-2";

                card.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <span class="w-2.5 h-8 rounded-lg ${team.badgeBg} shrink-0 shadow-sm"></span>
                        <input type="text" 
                               value="${escapeHtml(team.name)}" 
                               ${isLocked ? 'disabled' : ''}
                               onchange="updateTeamName(${idx}, this.value)"
                               class="bg-transparent text-sm sm:text-base font-extrabold text-slate-100 focus:bg-slate-800 focus:px-2 focus:py-1 focus:rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-400 w-full truncate border-b border-dashed border-slate-700 ${isLocked ? 'opacity-80 cursor-not-allowed' : ''}"
                               placeholder="ടീം പേര്">
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="changeScore(${idx}, -1)" 
                                ${isLocked ? 'disabled' : ''}
                                class="w-9 h-11 bg-slate-800 hover:bg-slate-700 active:bg-slate-950 text-slate-300 rounded-xl flex items-center justify-center font-bold text-lg border border-slate-700/80 active:scale-95 transition-all ${isLocked ? 'opacity-40 cursor-not-allowed' : ''}"
                                title="സ്കോർ കുറയ്ക്കുക">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>

                        <div onclick="${isLocked ? '' : `changeScore(${idx}, 1)`}" 
                             id="score-box-${idx}"
                             class="w-14 h-11 bg-slate-950 hover:bg-black rounded-xl flex items-center justify-center font-black text-xl text-amber-400 border border-amber-500/40 ${isLocked ? 'cursor-not-allowed opacity-90' : 'cursor-pointer active:scale-95'} transition-all shadow-inner"
                             title="${isLocked ? 'ലോക്ക് ചെയ്തിരിക്കുന്നു' : 'ടാപ്പ് ചെയ്ത് ജയം കൂട്ടുക'}">
                            ${team.wins}
                        </div>

                        <button onclick="changeScore(${idx}, 1)" 
                                ${isLocked ? 'disabled' : ''}
                                class="w-11 h-11 bg-gradient-to-br from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:bg-amber-700 text-slate-950 rounded-xl flex items-center justify-center font-black text-xl shadow-md ${isLocked ? 'opacity-40 cursor-not-allowed' : 'active:scale-95'} transition-all"
                                title="ജയം കൂട്ടുക">
                            <i class="fa-solid fa-plus text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("total-play-val").textContent = totalPlayCount;

            // Lock UI controls update
            const lockBtn = document.getElementById("lock-btn");
            const lockIcon = document.getElementById("lock-icon");
            const lockText = document.getElementById("lock-text");

            if (isLocked) {
                lockBtn.className = "px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-black rounded-lg transition-all flex items-center gap-1";
                lockIcon.className = "fa-solid fa-lock";
                lockText.textContent = "ലോക്ക്ഡ് (Locked)";
            } else {
                lockBtn.className = "px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-lg transition-all flex items-center gap-1";
                lockIcon.className = "fa-solid fa-lock-open";
                lockText.textContent = "അൺലോക്ക്ഡ്";
            }

            document.querySelectorAll('.lock-target').forEach(el => {
                if (isLocked) {
                    el.setAttribute('disabled', 'disabled');
                    el.classList.add('opacity-40', 'cursor-not-allowed');
                } else {
                    el.removeAttribute('disabled');
                    el.classList.remove('opacity-40', 'cursor-not-allowed');
                }
            });

            updateLeaderboard();
        }

        function changeScore(idx, delta) {
            if (isLocked) {
                showToast("സ്കോർ എഡിറ്റിംഗ് ലോക്ക് ചെയ്തിരിക്കുന്നു!");
                return;
            }
            if (teams[idx].wins + delta >= 0) {
                teams[idx].wins += delta;
                if (delta > 0) {
                    totalPlayCount += 1;
                }
                saveData();

                const box = document.getElementById(`score-box-${idx}`);
                if (box) {
                    box.textContent = teams[idx].wins;
                    box.classList.remove("score-anim");
                    void box.offsetWidth;
                    box.classList.add("score-anim");
                }
            }
        }

        function changeTotalPlay(delta) {
            if (isLocked) return;
            if (totalPlayCount + delta >= 0) {
                totalPlayCount += delta;
                saveData();
            }
        }

        function updateTeamName(idx, val) {
            if (isLocked) return;
            const trimmed = val.trim();
            teams[idx].name = trimmed !== "" ? trimmed : `Team ${idx + 1}`;
            saveData();
        }

        function updateLeaderboard() {
            const leaderEl = document.getElementById("leader-text");
            const podiumEl = document.getElementById("podium-text");
            const loserEl = document.getElementById("loser-text");

            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            if (maxWins === 0) {
                leaderEl.innerHTML = `<span class="text-slate-400 text-xs font-semibold">കളികൾ തുടങ്ങിയിട്ടില്ല</span>`;
                podiumEl.innerHTML = `2-ാം സ്ഥാനം കണക്കാക്കുന്നു...`;
                loserEl.innerHTML = `തോട്ട ടീമിനെ കണക്കാക്കുന്നു...`;
                return;
            }

            // 1st Place (Champions)
            const firstPlaces = sorted.filter(t => t.wins === maxWins);
            let leaderHtml = "";
            firstPlaces.forEach(f => {
                leaderHtml += `<div class="text-amber-300 font-black text-base">⭐ ${escapeHtml(f.name)} (${maxWins} ജയം) ⭐</div>`;
            });
            leaderHtml += `<div class="text-[11px] text-amber-400 font-bold mt-0.5">🌟 അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്! 🌟</div>`;
            leaderEl.innerHTML = leaderHtml;

            // 2nd Place Only
            let remaining = sorted.filter(t => t.wins < maxWins);
            if (remaining.length > 0) {
                const secondWins = remaining[0].wins;
                const secondPlaces = remaining.filter(t => t.wins === secondWins);
                podiumEl.innerHTML = `🥈 2nd Place: ${secondPlaces.map(s => escapeHtml(s.name)).join(", ")} (${secondWins} ജയം)`;
            } else {
                podiumEl.innerHTML = `മറ്റ് ടീമുകൾക്ക് ഒപ്പത്തിനൊപ്പം പോരാട്ടം!`;
            }

            // തോട്ട ടീം (Bottom Performers / Criticism)
            const lowestTeams = sorted.filter(t => t.wins === minWins);
            if (lowestTeams.length > 0 && minWins < maxWins) {
                loserEl.innerHTML = `🚨 തോട്ട ടീം: <span class="font-bold text-rose-200">${lowestTeams.map(l => escapeHtml(l.name)).join(", ")}</span> (${minWins} ജയം) <br><span class="text-[10px] italic text-rose-400">"ഇനിയും കഠിനാധ്വാനവും പ്രാക്ടീസും അത്യാവശ്യമാണ്! 🏸💥"</span>`;
            } else {
                loserEl.innerHTML = `മത്സരം കടുത്ത പോരാട്ടത്തിൽ!`;
            }
        }

        function resetScores() {
            if (isLocked) {
                showToast("ലോക്ക് മാറ്റിയിട്ട് മാത്രം റീസെറ്റ് ചെയ്യുക!");
                return;
            }
            if (window.confirm("എല്ലാ ടീമിന്റെയും സ്കോറും ടോട്ടൽ പ്ലേയും റീസെറ്റ് (0) ചെയ്യണമെന്നുറപ്പാണോ?")) {
                teams.forEach(t => t.wins = 0);
                totalPlayCount = 0;
                saveData();
                render();
            }
        }

        function shareWhatsApp() {
            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            let msg = "🏸 *WEST SMASH BADMINTON CLUB* 🏸\n";
            msg += "🏆 *ടൂർണമെന്റ് സ്കോർ ട്രാക്കർ* 🏆\n\n";

            teams.forEach((t, i) => {
                msg += `${i + 1}. ${t.name} : *${t.wins}* ജയം\n`;
            });

            msg += `\n🎮 *ആകെ കളികൾ (Total Play):* ${totalPlayCount}\n`;
            msg += "-------------------------\n";

            const firstPlaces = sorted.filter(t => t.wins === maxWins && maxWins > 0);
            if (firstPlaces.length > 0) {
                msg += `👑 *1st Place (ചാമ്പ്യന്മാർ):* ${firstPlaces.map(f => f.name).join(", ")} (${maxWins} ജയം)\n`;
                msg += `✨ *ടാഗ്‌ലൈൻ:* അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്!\n\n`;

                const lowestTeams = sorted.filter(t => t.wins === minWins && minWins < maxWins);
                if (lowestTeams.length > 0) {
                    msg += `🚨 *തോട്ട ടീം:* ${lowestTeams.map(l => l.name).join(", ")} (${minWins} ജയം)\n`;
                    msg += `💬 *വിമർശനം:* ഇനിയും പ്രാക്ടീസ് അത്യാവശ്യമാണ്! 🏸💥\n`;
                }
            } else {
                msg += `👑 കളികൾ ആരംഭിച്ചിട്ടില്ല\n`;
            }

            const area = document.createElement("textarea");
            area.value = msg;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);

            showToast("സ്കോർ കോപ്പി ചെയ്തു! വാട്സ്ആപ്പിലേക്ക് തുറക്കുന്നു...");

            const encoded = encodeURIComponent(msg);
            setTimeout(() => {
                window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
            }, 400);
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.classList.remove("opacity-0");
            setTimeout(() => {
                toast.classList.add("opacity-0");
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = initData;
    </script>
</body>
</html>
