<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEST SMASH BADMINTON CLUB - Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font for Malayalam & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            font-family: 'Manjari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #F1C40F 40%, #B8860B 80%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .score-anim {
            animation: bounce 0.18s ease-out;
        }
        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 select-none">

    <div class="w-full max-w-sm sm:max-w-md my-auto space-y-3">
        
        <!-- Header with Club Name (No Logo) -->
        <div class="text-center py-4 px-3 bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 border gold-border rounded-2xl shadow-2xl relative overflow-hidden">
            <h1 class="text-xl sm:text-2xl font-black font-cinzel gold-gradient-text tracking-wide leading-tight">WEST SMASH</h1>
            <h2 class="text-xs sm:text-sm font-bold font-cinzel text-amber-200/90 tracking-widest uppercase">BADMINTON CLUB</h2>
            <p class="text-[11px] text-slate-300 mt-1 font-semibold">Tournament Score Counter</p>
        </div>

        <!-- Teams List -->
        <div id="teams-list" class="space-y-2.5">
            <!-- Rendered by JS -->
        </div>

        <!-- Total Play Section (English Only & Read-only) -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between px-4 shadow-md">
            <span class="text-xs font-bold text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-amber-400"></i> Total Play :
            </span>
            <span id="total-play-val" class="text-amber-400 font-black text-lg bg-slate-950 px-3 py-1 rounded-xl border border-amber-500/20 min-w-[50px] text-center">
                0
            </span>
        </div>

        <!-- Leader / Winner / Loser Summary Section -->
        <div class="bg-gradient-to-r from-amber-500/15 via-blue-900/40 to-amber-500/15 border gold-border rounded-2xl p-3 text-center shadow-lg space-y-2">
            <div>
                <div class="text-[11px] font-bold text-amber-300 uppercase tracking-wide flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-crown text-amber-400"></i> ഒന്നാം സ്ഥാനക്കാർ (Champions)
                </div>
                <div id="leader-text" class="text-sm sm:text-base font-black text-white mt-0.5">
                    ലോഡ് ചെയ്യുന്നു...
                </div>
            </div>

            <div id="podium-text" class="text-xs text-amber-200/80 font-medium pt-1 border-t border-amber-500/20">
                2-ാം സ്ഥാനം കണക്കാക്കുന്നു...
            </div>

            <!-- തോറ്റ ടീം വിമർശനം -->
            <div id="loser-text" class="text-xs text-rose-300 font-semibold pt-1 border-t border-rose-500/20">
                തോറ്റ ടീമിനെ കണ്ടെത്തുന്നു...
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="resetScores()" class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-slate-300 font-bold py-3 px-3 rounded-xl border border-slate-700/80 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 shadow-md">
                <i class="fa-solid fa-rotate-right text-slate-400"></i> റീസെറ്റ് (Reset)
            </button>
            <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-3 px-3 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 border border-emerald-400/30">
                <i class="fa-brands fa-whatsapp text-sm text-emerald-100"></i> വാട്സ്ആപ്പിൽ ഷെയർ
            </button>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        സ്കോർ അപ്ഡേറ്റ് ചെയ്തു!
    </div>

    <script>
        const defaultTeams = [
            { id: 1, name: "Shafeer & Faisal", wins: 0, badgeBg: "bg-amber-500" },
            { id: 2, name: "Musthafa & Junaid", wins: 0, badgeBg: "bg-blue-600" },
            { id: 3, name: "Ashraf & Anwar", wins: 0, badgeBg: "bg-emerald-600" },
            { id: 4, name: "Aneesh & Anas", wins: 0, badgeBg: "bg-rose-600" },
            { id: 5, name: "Fahad & Mujeeb", wins: 0, badgeBg: "bg-purple-600" }
        ];

        let teams = [];
        let totalPlayCount = 0;
        let activeLock = false; // 2 മിനിറ്റ് ലോക്കിനായി

        const firebaseConfig = {
            databaseURL: "https://west-smash-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('west_smash_scores_v8');

        function initData() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    teams = data.teams || defaultTeams;
                    totalPlayCount = data.totalPlayCount || 0;
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    totalPlayCount = 0;
                    dbRef.set({ teams, totalPlayCount });
                }
                render();
            }, (error) => {
                console.error("Firebase read error:", error);
                const saved = localStorage.getItem("west_smash_scores_v8");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        teams = parsed.teams || defaultTeams;
                        totalPlayCount = parsed.totalPlayCount || 0;
                    } catch(e) { 
                        teams = JSON.parse(JSON.stringify(defaultTeams)); 
                        totalPlayCount = 0;
                    }
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    totalPlayCount = 0;
                }
                render();
            });
        }

        function saveData() {
            dbRef.set({ teams, totalPlayCount }).catch((error) => {
                console.error("Firebase write error:", error);
                localStorage.setItem("west_smash_scores_v8", JSON.stringify({ teams, totalPlayCount }));
            });
            updateLeaderboard();
        }

        function render() {
            const container = document.getElementById("teams-list");
            container.innerHTML = "";

            teams.forEach((team, idx) => {
                const card = document.createElement("div");
                card.className = "bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-2.5 flex items-center justify-between shadow-md gap-2";

                card.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <span class="w-2.5 h-8 rounded-lg ${team.badgeBg} shrink-0 shadow-sm"></span>
                        <input type="text" 
                               value="${escapeHtml(team.name)}" 
                               onchange="updateTeamName(${idx}, this.value)"
                               class="bg-transparent text-sm sm:text-base font-extrabold text-slate-100 focus:bg-slate-800 focus:px-2 focus:py-1 focus:rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-400 w-full truncate border-b border-dashed border-slate-700"
                               placeholder="ടീം പേര്">
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <div id="score-box-${idx}"
                             class="w-16 h-11 bg-slate-950 rounded-xl flex items-center justify-center font-black text-xl text-amber-400 border border-amber-500/40 shadow-inner">
                            ${team.wins}
                        </div>

                        <button onclick="addWin(${idx})" 
                                id="win-btn-${idx}"
                                class="h-11 px-3 bg-gradient-to-br from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:bg-amber-700 text-slate-950 rounded-xl flex items-center justify-center font-black text-xs gap-1 shadow-md active:scale-95 transition-all">
                            <i class="fa-solid fa-plus text-xs"></i> WIN
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("total-play-val").textContent = totalPlayCount;
            updateLeaderboard();
        }

        // ജയിച്ചാൽ മാത്രം സ്കോർ കൂട്ടാനും കൃത്യം 2 മിനിറ്റ് (120000 මිලිസെക്കൻഡ്) ലോക്ക് ചെയ്യാനുമുള്ള ഫങ്ഷൻ
        function addWin(idx) {
            if (activeLock) {
                showToast("దయവായി കാത്തിരിക്കുക! 2 മിനിറ്റ് ലോക്ക് active ആണ്.");
                return;
            }
            
            activeLock = true;
            
            // എല്ലാ WIN ബട്ടണുകളും താൽക്കാലികമായി ഡിസേബിൾ ചെയ്യുക
            document.querySelectorAll('[id^="win-btn-"]').forEach(btn => {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.setAttribute('disabled', 'true');
            });

            teams[idx].wins += 1;
            totalPlayCount += 1;
            saveData();

            showToast(`${teams[idx].name} - ജയം വിജയകരമായി ആഡ് ചെയ്തു!`);

            const box = document.getElementById(`score-box-${idx}`);
            if (box) {
                box.textContent = teams[idx].wins;
                box.classList.remove("score-anim");
                void box.offsetWidth;
                box.classList.add("score-anim");
            }

            // കൃത്യം 2 മിനിറ്റിനു ശേഷം (120,000 ms) വീണ്ടും ബട്ടണുകൾ വർക്ക് ചെയ്യും
            setTimeout(() => {
                activeLock = false;
                document.querySelectorAll('[id^="win-btn-"]').forEach(btn => {
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.removeAttribute('disabled');
                });
            }, 120000);
        }

        function updateTeamName(idx, val) {
            const trimmed = val.trim();
            teams[idx].name = trimmed !== "" ? trimmed : `Team ${idx + 1}`;
            saveData();
        }

        function updateLeaderboard() {
            const leaderEl = document.getElementById("leader-text");
            const podiumEl = document.getElementById("podium-text");
            const loserEl = document.getElementById("loser-text");

            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            if (maxWins === 0) {
                leaderEl.innerHTML = `<span class="text-slate-400 text-xs font-semibold">കളികൾ തുടങ്ങിയിട്ടില്ല</span>`;
                podiumEl.innerHTML = `2-ാം സ്ഥാനം കണക്കാക്കുന്നു...`;
                loserEl.innerHTML = `തോറ്റ ടീമിനെ കണക്കാക്കുന്നു...`;
                return;
            }

            // 1st Place (Champions)
            const firstPlaces = sorted.filter(t => t.wins === maxWins);
            let leaderHtml = "";
            firstPlaces.forEach(f => {
                leaderHtml += `<div class="text-amber-300 font-black text-base">⭐ ${escapeHtml(f.name)} (${maxWins} ജയം) ⭐</div>`;
            });
            leaderHtml += `<div class="text-[11px] text-amber-400 font-bold mt-0.5">🌟 അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്! 🌟</div>`;
            leaderEl.innerHTML = leaderHtml;

            // 2nd Place
            let remaining = sorted.filter(t => t.wins < maxWins);
            if (remaining.length > 0) {
                const secondWins = remaining[0].wins;
                const secondPlaces = remaining.filter(t => t.wins === secondWins);
                podiumEl.innerHTML = `🥈 2nd Place: ${secondPlaces.map(s => escapeHtml(s.name)).join(", ")} (${secondWins} ജയം)`;
            } else {
                podiumEl.innerHTML = `മറ്റ് ടീമുകൾക്ക് ഒപ്പത്തിനൊപ്പം പോരാട്ടം!`;
            }

            // തോറ്റ ടീം (Bottom Performers / Criticism)
            const lowestTeams = sorted.filter(t => t.wins === minWins);
            if (lowestTeams.length > 0 && minWins < maxWins) {
                loserEl.innerHTML = `🚨 തോറ്റ ടീം: <span class="font-bold text-rose-200">${lowestTeams.map(l => escapeHtml(l.name)).join(", ")}</span> (${minWins} ജയം) <br><span class="text-[10px] italic text-rose-400">"ഇനിയും കഠിനാധ്വാനവും പ്രാക്ടീസും അത്യാവശ്യമാണ്! 🏸💥"</span>`;
            } else {
                loserEl.innerHTML = `മത്സരം കടുത്ത പോരാട്ടത്തിൽ!`;
            }
        }

        function resetScores() {
            if (window.confirm("അന്നത്തെ ടൂർണമെന്റ് സ്കോറുകളും Total Play-യും റീസെറ്റ് ചെയ്യണോ?")) {
                teams.forEach(t => t.wins = 0);
                totalPlayCount = 0;
                saveData();
                render();
            }
        }

        function shareWhatsApp() {
            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            let msg = "🏸 *WEST SMASH BADMINTON CLUB* 🏸\n";
            msg += "🏆 *Tournament Score Counter* 🏆\n\n";

            teams.forEach((t, i) => {
                msg += `${i + 1}. ${t.name} : *${t.wins}* ജയം\n`;
            });

            msg += `\n🎮 *Total Play:* ${totalPlayCount}\n`;
            msg += "-------------------------\n";

            const firstPlaces = sorted.filter(t => t.wins === maxWins && maxWins > 0);
            if (firstPlaces.length > 0) {
                msg += `👑 *1st Place (ചാമ്പ്യന്മാർ):* ${firstPlaces.map(f => f.name).join(", ")} (${maxWins} ജയം)\n`;
                msg += `✨ *ടാഗ്‌ലൈൻ:* അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്!\n\n`;

                const lowestTeams = sorted.filter(t => t.wins === minWins && minWins < maxWins);
                if (lowestTeams.length > 0) {
                    msg += `🚨 *തോറ്റ ടീം:* ${lowestTeams.map(l => l.name).join(", ")} (${minWins} ജയം)\n`;
                    msg += `💬 *വിമർശനം:* ഇനിയും പ്രാക്ടീസ് അത്യാവശ്യമാണ്! 🏸💥\n`;
                }
            } else {
                msg += `👑 കളികൾ ആരംഭിച്ചിട്ടില്ല\n`;
            }

            const area = document.createElement("textarea");
            area.value = msg;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);

            showToast("സ്കോർ കോപ്പി ചെയ്തു! വാട്സ്ആപ്പിലേക്ക് തുറക്കുന്നു...");

            const encoded = encodeURIComponent(msg);
            setTimeout(() => {
                window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
            }, 400);
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.classList.remove("opacity-0");
            setTimeout(() => {
                toast.classList.add("opacity-0");
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = initData;
    </script>
</body>
</html>
