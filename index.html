<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEST SMASH BADMINTON CLUB - Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font for Malayalam & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            font-family: 'Manjari', 'Poppins', sans-serif;
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-4">

    <!-- Header / Logo Section -->
    <header class="w-full max-w-2xl mx-auto text-center py-4">
        <div class="flex items-center justify-center gap-3 mb-2">
            <!-- Original SVG Logo -->
            <svg class="w-12 h-12 text-yellow-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                <path d="M2 12h20"></path>
            </svg>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 bg-clip-text text-transparent">
                WEST SMASH BADMINTON CLUB
            </h1>
        </div>
        <div id="lock-status" class="text-sm font-semibold px-4 py-1.5 rounded-full inline-block bg-emerald-600/30 text-emerald-400 border border-emerald-500/30">
            <i class="fa-solid fa-lock-open mr-1"></i> Live Active (2 Min Auto-Lock)
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl mx-auto space-y-6 my-auto">
        <!-- Score Board Container -->
        <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-3xl p-6 custom-shadow">
            
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
                    <i class="fa-solid fa-trophy"></i> Live Score Board
                </h2>
                <div class="text-sm bg-slate-700 px-3 py-1 rounded-full text-slate-300">
                    Total Plays: <span id="total-play-val" class="font-bold text-white">0</span>
                </div>
            </div>

            <!-- Team Scores List -->
            <div id="teams-container" class="space-y-4">
                <!-- Dynamically Populated by JS -->
            </div>
        </div>

        <!-- Leaderboard & Highlights Section -->
        <div class="bg-slate-800/60 backdrop-blur-md border border-slate-700/50 rounded-2xl p-5">
            <h3 class="text-base font-bold text-orange-400 mb-3 flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-orange-400 animate-ping"></span> Tournament Standings
            </h3>
            <div id="standings-container" class="space-y-2 text-sm">
                <!-- Highlights & Criticism -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        &copy; West Smash Badminton Club | Powered by Firebase & GitHub Pages
    </footer>

    <!-- Firebase Logic & Interactive Scripts -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://west-smash-scores-v14-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Team List Setup
        let teamsData = [
            { id: 'team1', name: 'Team Alpha', score: 0 },
            { id: 'team2', name: 'Team Titans', score: 0 },
            { id: 'team3', name: 'Team Smashers', score: 0 },
            { id: 'team4', name: 'Team Strikers', score: 0 }
        ];

        let totalPlayCount = 0;
        let isLocked = false;
        let lockTimer = null;

        // DOM Elements
        const teamsContainer = document.getElementById('teams-container');
        const standingsContainer = document.getElementById('standings-container');
        const totalPlayVal = document.getElementById('total-play-val');
        const lockStatus = document.getElementById('lock-status');

        // Render UI
        function renderUI() {
            // Sort teams by score descending for standings
            let sortedTeams = [...teamsData].sort((a, b) => b.score - a.score);

            // Render Teams Controls (Minus and Plus buttons)
            teamsContainer.innerHTML = teamsData.map(team => `
                <div class="flex items-center justify-between bg-slate-700/40 border border-slate-600/50 p-3 rounded-xl">
                    <span class="font-semibold text-base">${team.name}</span>
                    <div class="flex items-center gap-3">
                        <button onclick="updateScore('${team.id}', -1)" ${isLocked ? 'disabled' : ''} 
                            class="w-9 h-9 flex items-center justify-center bg-red-600/80 hover:bg-red-500 active:scale-95 disabled:opacity-40 rounded-lg text-white font-bold transition shadow">
                            <i class="fa-solid fa-minus text-xs"></i>
                        </button>
                        <span class="text-xl font-bold w-8 text-center">${team.score}</span>
                        <button onclick="updateScore('${team.id}', 1)" ${isLocked ? 'disabled' : ''} 
                            class="w-9 h-9 flex items-center justify-center bg-emerald-600/80 hover:bg-emerald-500 active:scale-95 disabled:opacity-40 rounded-lg text-white font-bold transition shadow">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            totalPlayVal.innerText = totalPlayCount;

            // Render Standings (1st Undefeated Champion, 2nd, and Losers Criticism)
            let standingsHTML = '';
            if (sortedTeams.length > 0) {
                // 1st Place (Undefeated Champion)
                standingsHTML += `
                    <div class="flex items-center justify-between bg-yellow-500/20 border border-yellow-500/40 p-2.5 rounded-xl text-yellow-300 font-bold">
                        <span><i class="fa-solid fa-crown mr-1"></i> 1st Place (Undefeated Champions): ${sortedTeams[0].name}</span>
                        <span>${sortedTeams[0].score} Pts</span>
                    </div>`;
            }
            if (sortedTeams.length > 1) {
                // 2nd Place
                standingsHTML += `
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 p-2 rounded-lg text-slate-200">
                        <span><i class="fa-solid fa-medal mr-1 text-slate-400"></i> 2nd Place: ${sortedTeams[1].name}</span>
                        <span>${sortedTeams[1].score} Pts</span>
                    </div>`;
            }
            // Loser Team Criticism (Last Place)
            if (sortedTeams.length > 2) {
                let lastTeam = sortedTeams[sortedTeams.length - 1];
                standingsHTML += `
                    <div class="flex items-center justify-between bg-red-950/40 border border-red-900/50 p-2 rounded-lg text-red-300 text-xs mt-2">
                        <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> Critical Note: ${lastTeam.name} needs serious practice and better coordination!</span>
                        <span>${lastTeam.score} Pts</span>
                    </div>`;
            }
            standingsContainer.innerHTML = standingsHTML;
        }

        // Score Update Function (+1 or -1)
        window.updateScore = function(teamId, delta) {
            if (isLocked) return;

            teamsData = teamsData.map(team => {
                if (team.id === teamId) {
                    let newScore = team.score + delta;
                    return { ...team, score: newScore < 0 ? 0 : newScore };
                }
                return team;
            });

            totalPlayCount += 1;

            // Push to Firebase
            db.ref('west_smash_scores_v14').set({
                teams: teamsData,
                totalPlay: totalPlayCount
            });

            triggerLockSystem();
        };

        // 2-Minute Automatic Locking System
        function triggerLockSystem() {
            isLocked = true;
            lockStatus.className = "text-sm font-semibold px-4 py-1.5 rounded-full inline-block bg-red-600/30 text-red-400 border border-red-500/30";
            lockStatus.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> Locked (2 Min Cooldown)';

            if (lockTimer) clearTimeout(lockTimer);

            lockTimer = setTimeout(() => {
                isLocked = false;
                lockStatus.className = "text-sm font-semibold px-4 py-1.5 rounded-full inline-block bg-emerald-600/30 text-emerald-400 border border-emerald-500/30";
                lockStatus.innerHTML = '<i class="fa-solid fa-lock-open mr-1"></i> Live Active (2 Min Auto-Lock)';
                renderUI();
            }, 120000); // 2 Minutes = 120,000 ms

            renderUI();
        }

        // Real-time Firebase Listener
        db.ref('west_smash_scores_v14').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.teams) teamsData = data.teams;
                if (data.totalPlay !== undefined) totalPlayCount = data.totalPlay;
                renderUI();
            }
        });
    </script>
</body>
</html>
