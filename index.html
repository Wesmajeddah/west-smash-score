<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEST SMASH BADMINTON CLUB - Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Malayalam & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manjari:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            font-family: 'Manjari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF099 0%, #F1C40F 40%, #B8860B 80%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .score-anim {
            animation: bounce 0.18s ease-out;
        }
        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 select-none">

    <div class="w-full max-w-sm sm:max-w-md my-auto space-y-3">
        
        <!-- Header with Original Logo Emblem and Club Name -->
        <div class="text-center py-3 px-3 bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 border gold-border rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- SVG Logo Emblem -->
            <div class="flex justify-center mb-1">
                <div class="w-20 h-20 sm:w-24 sm:h-24 relative drop-shadow-[0_4px_12px_rgba(212,175,55,0.4)]">
                    <svg viewBox="0 0 200 200" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <radialGradient id="goldGrad" cx="50%" cy="30%" r="70%">
                                <stop offset="0%" stop-color="#FFE082" />
                                <stop offset="40%" stop-color="#D4AF37" />
                                <stop offset="85%" stop-color="#8B6508" />
                                <stop offset="100%" stop-color="#5B4000" />
                            </radialGradient>
                            <radialGradient id="bgBlue" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#1E3E62" />
                                <stop offset="100%" stop-color="#0B192C" />
                            </radialGradient>
                            <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFF59D" />
                                <stop offset="50%" stop-color="#D4AF37" />
                                <stop offset="100%" stop-color="#996515" />
                            </linearGradient>
                        </defs>

                        <!-- Outer Golden Border -->
                        <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" />
                        <circle cx="100" cy="100" r="88" fill="url(#bgBlue)" stroke="url(#goldGrad)" stroke-width="2" />
                        <circle cx="100" cy="100" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />

                        <!-- Curved Header Text path -->
                        <path id="textArcTop" d="M 22 100 A 78 78 0 0 1 178 100" fill="none" />
                        <text font-family="Cinzel, serif" font-weight="900" font-size="14" fill="#FFE082" letter-spacing="1.5">
                            <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
                                WEST SMASH
                            </textPath>
                        </text>

                        <!-- Curved Footer Text path -->
                        <path id="textArcBottom" d="M 178 100 A 78 78 0 0 1 22 100" fill="none" />
                        <text font-family="Cinzel, serif" font-weight="800" font-size="11" fill="#FFE082" letter-spacing="1">
                            <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
                                BADMINTON CLUB
                            </textPath>
                        </text>

                        <!-- Side Stars -->
                        <polygon points="25,100 28,96 32,100 28,104" fill="url(#goldLight)" />
                        <polygon points="175,100 172,96 168,100 172,104" fill="url(#goldLight)" />

                        <!-- Inner Graphics -->
                        <g transform="translate(0, -2)">
                            <path d="M 75 55 Q 88 42 98 55 Q 88 68 75 55 Z" fill="none" stroke="url(#goldLight)" stroke-width="2" />
                            <line x1="86.5" y1="61.5" x2="110" y2="85" stroke="url(#goldLight)" stroke-width="2" />
                            <path d="M 45 68 C 55 90 68 120 85 125 C 95 110 92 88 92 78 C 96 90 102 120 115 125 C 130 115 145 88 155 70 C 145 92 125 138 100 138 C 75 138 55 92 45 68 Z" fill="url(#goldGrad)" />
                            <g transform="translate(118, 52) rotate(25)">
                                <path d="M 0 0 Q 10 -15 22 -18 L 18 8 Z" fill="url(#goldLight)" opacity="0.9" />
                                <path d="M 0 0 Q 18 -5 26 8 L 12 14 Z" fill="url(#goldLight)" />
                                <ellipse cx="2" cy="2" rx="4" ry="5" fill="#FFF099" />
                            </g>
                        </g>

                        <!-- Since 2026 Banner -->
                        <line x1="62" y1="148" x2="80" y2="148" stroke="url(#goldLight)" stroke-width="1" />
                        <text x="100" y="151" font-family="Cinzel, serif" font-weight="700" font-size="8.5" fill="#FFF099" text-anchor="middle">SINCE 2026</text>
                        <line x1="120" y1="148" x2="138" y2="148" stroke="url(#goldLight)" stroke-width="1" />
                    </svg>
                </div>
            </div>

            <h1 class="text-xl sm:text-2xl font-black font-cinzel gold-gradient-text tracking-wide leading-tight">WEST SMASH</h1>
            <h2 class="text-xs sm:text-sm font-bold font-cinzel text-amber-200/90 tracking-widest uppercase">BADMINTON CLUB</h2>
            
            <div class="mt-2 flex items-center justify-center gap-2">
                <span id="lock-status-text" class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-lock-open"></i> Live Scoring Active
                </span>
            </div>
        </div>

        <!-- Teams List -->
        <div id="teams-list" class="space-y-2.5">
            <!-- Rendered by JS -->
        </div>

        <!-- Total Play Section & Active Timer -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2 shadow-md">
            <div class="flex items-center justify-between px-2">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-2 font-poppins">
                    <i class="fa-solid fa-gamepad text-amber-400"></i> Total Plays :
                </span>
                <span id="total-play-val" class="text-amber-400 font-black text-lg bg-slate-950 px-4 py-1 rounded-xl border border-amber-500/20 min-w-[60px] text-center shadow-inner font-poppins">
                    0
                </span>
            </div>
            
            <!-- Live Active Match Duration Counter with Start Match Option -->
            <div class="text-[11px] text-slate-400 bg-slate-950/60 p-2 rounded-xl flex items-center justify-between border border-slate-800 font-poppins">
                <span class="flex items-center gap-1 text-slate-300">
                    <i class="fa-solid fa-stopwatch text-emerald-400"></i> Current Match Duration:
                </span>
                <div class="flex items-center gap-2">
                    <span id="current-match-timer" class="font-bold text-emerald-400">0m 0s</span>
                    <button id="start-match-btn" onclick="startFirstMatch()" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded font-bold">
                        Start Match
                    </button>
                </div>
            </div>
        </div>

        <!-- Leader / Winner / Loser Summary Section -->
        <div class="bg-gradient-to-r from-amber-500/15 via-blue-900/40 to-amber-500/15 border gold-border rounded-2xl p-3 text-center shadow-lg space-y-2">
            <div>
                <div class="text-[11px] font-bold text-amber-300 uppercase tracking-wide flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-crown text-amber-400"></i> ഒന്നാം സ്ഥാനക്കാർ (Undefeated Champions)
                </div>
                <div id="leader-text" class="text-sm sm:text-base font-black text-white mt-0.5">
                    ലോഡ് ചെയ്യുന്നു...
                </div>
            </div>

            <div id="podium-text" class="text-xs text-amber-200/80 font-medium pt-1 border-t border-amber-500/20">
                2-ാം സ്ഥാനം കണക്കാക്കുന്നു...
            </div>

            <!-- തോറ്റ ടീം വിമർശന ഭാഗം -->
            <div id="loser-text" class="text-xs text-rose-300 font-semibold pt-1 border-t border-rose-500/20">
                തോറ്റ ടീമിനെ കണ്ടെത്തുന്നു...
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="resetScores()" class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-slate-300 font-bold py-3 px-3 rounded-xl border border-slate-700/80 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 shadow-md">
                <i class="fa-solid fa-rotate-right text-slate-400"></i> റീസെറ്റ് (Reset)
            </button>
            <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-3 px-3 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 border border-emerald-400/30">
                <i class="fa-brands fa-whatsapp text-sm text-emerald-100"></i> വാട്സ്ആപ്പിൽ ഷെയർ
            </button>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        സ്കോർ അപ്ഡേറ്റ് ചെയ്തു!
    </div>

    <script>
        const ADMIN_PIN = "1234"; 

        const defaultTeams = [
            { id: 1, name: "Shafeer & Faisal", wins: 0, badgeBg: "bg-amber-500", lastMatchTime: 0 },
            { id: 2, name: "Musthafa & Junaid", wins: 0, badgeBg: "bg-blue-600", lastMatchTime: 0 },
            { id: 3, name: "Ashraf & Anwar", wins: 0, badgeBg: "bg-emerald-600", lastMatchTime: 0 },
            { id: 4, name: "Aneesh & Anas", wins: 0, badgeBg: "bg-rose-600", lastMatchTime: 0 },
            { id: 5, name: "Fahad & Mujeeb", wins: 0, badgeBg: "bg-purple-600", lastMatchTime: 0 }
        ];

        let teams = [];
        let lastActionTimestamp = null;
        let timerInterval = null;

        const firebaseConfig = {
            databaseURL: "https://west-smash-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('west_smash_scores_v14');

        function initData() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    teams = data.teams || defaultTeams;
                    lastActionTimestamp = data.lastActionTimestamp || null;
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    lastActionTimestamp = null;
                    dbRef.set({ teams, lastActionTimestamp });
                }
                render();
                startLiveTimer();
            }, (error) => {
                console.error("Firebase read error:", error);
                const saved = localStorage.getItem("west_smash_scores_v14");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        teams = parsed.teams || defaultTeams;
                        lastActionTimestamp = parsed.lastActionTimestamp || null;
                    } catch(e) { 
                        teams = JSON.parse(JSON.stringify(defaultTeams)); 
                        lastActionTimestamp = null;
                    }
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    lastActionTimestamp = null;
                }
                render();
                startLiveTimer();
            });
        }

        function calculateTotalPlays() {
            return teams.reduce((sum, team) => sum + team.wins, 0);
        }

        function saveData() {
            dbRef.set({ teams, lastActionTimestamp }).catch((error) => {
                console.error("Firebase write error:", error);
                localStorage.setItem("west_smash_scores_v14", JSON.stringify({ teams, lastActionTimestamp }));
            });
            updateLeaderboard();
        }

        function startFirstMatch() {
            lastActionTimestamp = Date.now();
            saveData();
            showToast("Match timer started!");
        }

        function startLiveTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const timerEl = document.getElementById("current-match-timer");
                const startBtn = document.getElementById("start-match-btn");

                if (!lastActionTimestamp) {
                    timerEl.textContent = "0m 0s";
                    startBtn.classList.remove("hidden");
                    return;
                }
                
                startBtn.classList.add("hidden");
                const diffMs = Date.now() - lastActionTimestamp;
                const minutes = Math.floor(diffMs / 60000);
                const seconds = Math.floor((diffMs % 60000) / 1000);

                timerEl.textContent = `${minutes}m ${seconds}s`;
            }, 1000);
        }

        function render() {
            const container = document.getElementById("teams-list");
            container.innerHTML = "";

            teams.forEach((team, idx) => {
                const card = document.createElement("div");
                card.className = "bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-2.5 flex flex-col shadow-md gap-1.5";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="w-2.5 h-8 rounded-lg ${team.badgeBg} shrink-0 shadow-sm"></span>
                            <input type="text" 
                                   value="${escapeHtml(team.name)}" 
                                   onchange="updateTeamName(${idx}, this.value)"
                                   class="bg-transparent text-sm sm:text-base font-extrabold text-slate-100 focus:bg-slate-800 focus:px-2 focus:py-1 focus:rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-400 w-full truncate border-b border-dashed border-slate-700"
                                   placeholder="ടീം പേര്">
                        </div>

                        <div class="flex items-center gap-1.5 shrink-0">
                            <!-- Minus Button (Amendment / Decrement -> PIN Required) -->
                            <button onclick="handleScoreChange(${idx}, -1)" 
                                    class="w-8 h-11 bg-rose-950/80 hover:bg-rose-900 active:bg-rose-950 text-rose-300 rounded-xl flex items-center justify-center font-bold text-xs shadow-md active:scale-95 transition-all border border-rose-800/50"
                                    title="Decrease score (Amendment requires PIN)">
                                <i class="fa-solid fa-minus"></i>
                            </button>

                            <div id="score-box-${idx}"
                                 class="w-12 h-11 bg-slate-950 rounded-xl flex items-center justify-center font-black text-lg text-amber-400 border border-amber-500/40 shadow-inner font-poppins">
                                ${team.wins}
                            </div>

                            <!-- Plus Button (Adding new win -> NO PIN Required, anytime!) -->
                            <button onclick="handleScoreChange(${idx}, 1)" 
                                    class="w-8 h-11 bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-800 text-white rounded-xl flex items-center justify-center font-bold text-xs shadow-md active:scale-95 transition-all border border-emerald-500/50"
                                    title="Add Win (No password needed)">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Match Time Indicator -->
                    <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-800/60 px-1 font-poppins">
                        <span class="flex items-center gap-1"><i class="fa-regular fa-clock text-amber-400"></i> Last Match Duration:</span>
                        <span class="font-bold text-amber-300">${team.lastMatchTime ? team.lastMatchTime + ' mins' : 'Not recorded'}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("total-play-val").textContent = calculateTotalPlays();
            updateLeaderboard();
        }

        function handleScoreChange(idx, delta) {
            // IF ADDING WIN (delta > 0): NO PASSWORD NEEDED AT ALL! ANYTIME!
            if (delta > 0) {
                const now = Date.now();
                if (lastActionTimestamp) {
                    const durationMinutes = Math.round((now - lastActionTimestamp) / 60000);
                    teams[idx].lastMatchTime = durationMinutes > 0 ? durationMinutes : 1;
                }
                lastActionTimestamp = now;

                teams[idx].wins += delta;
                saveData();
                showToast(`${teams[idx].name} വിജയം വിജയകരമായി ചേർത്തു! 🏸`);
            } 
            // IF DECREASING / AMENDING (delta < 0): REQUIRE ADMIN PIN!
            else if (delta < 0) {
                const pin = prompt("ഇത് ഒരു തിരുത്തലാണ് (Amendment). സ്കോർ കുറയ്ക്കുന്നതിന് Admin PIN നൽകുക:");
                if (pin !== ADMIN_PIN) {
                    if (pin !== null) alert("തെറ്റായ PIN! തിരുത്തൽ സാധ്യമല്ല.");
                    return;
                }

                if (teams[idx].wins + delta < 0) return;

                teams[idx].wins += delta;
                saveData();
                showToast(`${teams[idx].name} സ്കോർ തിരുത്തി (Amended)!`);
            }

            const box = document.getElementById(`score-box-${idx}`);
            if (box) {
                box.textContent = teams[idx].wins;
                box.classList.remove("score-anim");
                void box.offsetWidth;
                box.classList.add("score-anim");
            }
        }

        function updateTeamName(idx, val) {
            const trimmed = val.trim();
            teams[idx].name = trimmed !== "" ? trimmed : `Team ${idx + 1}`;
            saveData();
        }

        function updateLeaderboard() {
            const leaderEl = document.getElementById("leader-text");
            const podiumEl = document.getElementById("podium-text");
            const loserEl = document.getElementById("loser-text");

            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            if (maxWins === 0) {
                leaderEl.innerHTML = `<span class="text-slate-400 text-xs font-semibold">കളികൾ തുടങ്ങിയിട്ടില്ല</span>`;
                podiumEl.innerHTML = `2-ാം സ്ഥാനം കണക്കാക്കുന്നു...`;
                loserEl.innerHTML = `തോറ്റ ടീമിനെ കണ്ടെത്തുന്നു...`;
                return;
            }

            const firstPlaces = sorted.filter(t => t.wins === maxWins);
            let leaderHtml = "";
            firstPlaces.forEach(f => {
                leaderHtml += `<div class="text-amber-300 font-black text-base">⭐ ${escapeHtml(f.name)} (${maxWins} ജയം) ⭐</div>`;
            });
            leaderHtml += `<div class="text-[11px] text-amber-400 font-bold mt-0.5">🌟 അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്! 🌟</div>`;
            leaderEl.innerHTML = leaderHtml;

            let remaining = sorted.filter(t => t.wins < maxWins);
            if (remaining.length > 0) {
                const secondWins = remaining[0].wins;
                const secondPlaces = remaining.filter(t => t.wins === secondWins);
                podiumEl.innerHTML = `🥈 2nd Place: ${secondPlaces.map(s => escapeHtml(s.name)).join(", ")} (${secondWins} ജയം)`;
            } else {
                podiumEl.innerHTML = `മറ്റ് ടീമുകൾക്ക് ഒപ്പത്തിനൊപ്പം പോരാട്ടം!`;
            }

            const lowestTeams = sorted.filter(t => t.wins === minWins);
            if (lowestTeams.length > 0 && minWins < maxWins) {
                loserEl.innerHTML = `🚨 തോറ്റ ടീം: <span class="font-bold text-rose-200">${lowestTeams.map(l => escapeHtml(l.name)).join(", ")}</span> (${minWins} ജയം) <br><span class="text-[10px] italic text-rose-400 font-normal">"ഇനിയും കഠിനാധ്വാനവും പ്രാക്ടീസും അത്യാവശ്യമാണ്! 🏸💥"</span>`;
            } else {
                loserEl.innerHTML = `മത്സരം കടുത്ത പോരാട്ടത്തിൽ!`;
            }
        }

        function resetScores() {
            const inputPin = prompt("ടൂർണമെന്റ് റീസെറ്റ് ചെയ്യുന്നതിന് Admin PIN നൽകുക:");
            if (inputPin !== ADMIN_PIN) {
                if (inputPin !== null) alert("തെറ്റായ PIN!");
                return;
            }
            if (window.confirm("എല്ലാ സ്കോറുകളും ടൈമറുകളും പൂർണ്ണമായി റീസെറ്റ് ചെയ്യണോ?")) {
                teams.forEach(t => {
                    t.wins = 0;
                    t.lastMatchTime = 0;
                });
                lastActionTimestamp = null;
                saveData();
                render();
            }
        }

        function shareWhatsApp() {
            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            let msg = "🏸 *WEST SMASH BADMINTON CLUB* 🏸\n";
            msg += "🏆 *Tournament Score Counter* 🏆\n\n";

            teams.forEach((t, i) => {
                let timeStr = t.lastMatchTime ? ` (${t.lastMatchTime} mins)` : '';
                msg += `${i + 1}. ${t.name} : *${t.wins}* ജയം${timeStr}\n`;
            });

            msg += `\n🎮 *Total Plays:* ${calculateTotalPlays()}\n`;
            msg += "-------------------------\n";

            const firstPlaces = sorted.filter(t => t.wins === maxWins && maxWins > 0);
            if (firstPlaces.length > 0) {
                msg += `👑 *1st Place (ചാമ്പ്യന്മാർ):* ${firstPlaces.map(f => f.name).join(", ")} (${maxWins} ജയം)\n`;
            }

            let remaining = sorted.filter(t => t.wins < maxWins && maxWins > 0);
            if (remaining.length > 0) {
                const secondWins = remaining[0].wins;
                const secondPlaces = remaining.filter(t => t.wins === secondWins);
                msg += `🥈 *2nd Place:* ${secondPlaces.map(s => s.name).join(", ")} (${secondWins} ജയം)\n`;
            }

            const lowestTeams = sorted.filter(t => t.wins === minWins && minWins < maxWins);
            if (lowestTeams.length > 0) {
                msg += `🚨 *Critical Note:* ${lowestTeams.map(l => l.name).join(", ")} needs practice! (${minWins} ജയം)\n`;
            }

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Start App
        initData();
    </script>
</body>
</html>
