<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WESMA BADMINTON CLUB - Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Malayalam & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Manjari:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            font-family: 'Manjari', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFE082 0%, #D4AF37 40%, #B8860B 80%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .score-anim {
            animation: bounce 0.18s ease-out;
        }
        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-4 select-none">

    <div class="w-full max-w-sm sm:max-w-md my-auto space-y-3">
        
        <!-- Header with Wesma Logo Emblem -->
        <div class="text-center py-3 px-3 bg-gradient-to-b from-slate-900 via-blue-950 to-slate-900 border gold-border rounded-2xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- SVG Wesma Custom Logo Emblem -->
            <div class="flex justify-center mb-1">
                <div class="w-24 h-24 sm:w-28 sm:h-28 relative drop-shadow-[0_4px_12px_rgba(212,175,55,0.4)]">
                    <svg viewBox="0 0 200 200" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#FFE082" />
                                <stop offset="50%" stop-color="#D4AF37" />
                                <stop offset="100%" stop-color="#A67C1E" />
                            </linearGradient>
                            <radialGradient id="bgDark" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#0f172a" />
                                <stop offset="100%" stop-color="#020617" />
                            </radialGradient>
                        </defs>

                        <!-- Outer Shield/Emblem Base -->
                        <circle cx="100" cy="100" r="96" fill="url(#copperGrad)" />
                        <circle cx="100" cy="100" r="90" fill="url(#bgDark)" stroke="url(#copperGrad)" stroke-width="1.5" />
                        <circle cx="100" cy="100" r="74" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1" stroke-dasharray="2,3" />

                        <!-- Wesma 'W' Monogram combined with Shuttlecock -->
                        <g transform="translate(0, 2)">
                            <path d="M 56 75 L 74 118 L 100 92 L 126 118 L 144 75" fill="none" stroke="url(#copperGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                            <g transform="translate(100, 50) scale(0.85)">
                                <path d="M -10 12 L -7 2 C -4 -2 4 -2 7 2 L 10 12 Z" fill="#FFF" stroke="url(#copperGrad)" stroke-width="1.5"/>
                                <path d="M -9 6 Q 0 3 9 6" fill="none" stroke="url(#copperGrad)" stroke-width="1.5"/>
                                <ellipse cx="0" cy="14" rx="5" ry="2" fill="url(#copperGrad)"/>
                            </g>
                        </g>

                        <!-- Curved Header Text: WESMA -->
                        <path id="textArcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
                        <text font-family="Orbitron, sans-serif" font-weight="900" font-size="15" fill="#FFE082" letter-spacing="4">
                            <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
                                WESMA
                            </textPath>
                        </text>

                        <!-- Curved Footer Text: JEDDAH • SINCE 2026 -->
                        <path id="textArcBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />
                        <text font-family="Orbitron, sans-serif" font-weight="700" font-size="7.5" fill="#FFE082" letter-spacing="1.5">
                            <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
                                JEDDAH • SINCE 2026
                            </textPath>
                        </text>
                    </svg>
                </div>
            </div>

            <h1 class="text-2xl sm:text-3xl font-black font-orbitron gold-gradient-text tracking-wider leading-tight">WESMA</h1>
            <h2 class="text-xs sm:text-sm font-bold font-orbitron text-amber-200/90 tracking-widest uppercase">BADMINTON CLUB</h2>
            
            <div class="mt-2 flex items-center justify-center gap-2">
                <span id="lock-status-text" class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-lock-open"></i> Live Scoring Active
                </span>
            </div>
        </div>

        <!-- Teams List (Auto Sorted by Score) -->
        <div id="teams-list" class="space-y-2.5">
            <!-- Rendered by JS -->
        </div>

        <!-- Total Play Section & Timers -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2 shadow-md">
            <div class="flex items-center justify-between px-2">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-2 font-poppins">
                    <i class="fa-solid fa-gamepad text-amber-400"></i> Total Plays :
                </span>
                <span id="total-play-val" class="text-amber-400 font-black text-lg bg-slate-950 px-4 py-1 rounded-xl border border-amber-500/20 min-w-[60px] text-center shadow-inner font-poppins">
                    0
                </span>
            </div>
            
            <!-- Current Match Duration Counter with Start Match Option -->
            <div class="text-[11px] text-slate-400 bg-slate-950/60 p-2 rounded-xl flex items-center justify-between border border-slate-800 font-poppins">
                <span class="flex items-center gap-1 text-slate-300">
                    <i class="fa-solid fa-stopwatch text-emerald-400"></i> Current Match Duration:
                </span>
                <div class="flex items-center gap-2">
                    <span id="current-match-timer" class="font-bold text-emerald-400">0m 0s</span>
                    <button id="start-match-btn" onclick="startFirstMatch()" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded font-bold">
                        Start Match
                    </button>
                </div>
            </div>

            <!-- Total Tournament Duration Counter -->
            <div class="text-[11px] text-slate-400 bg-slate-950/60 p-2 rounded-xl flex items-center justify-between border border-slate-800 font-poppins">
                <span class="flex items-center gap-1 text-slate-300">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> Total Duration:
                </span>
                <span id="total-duration-timer" class="font-bold text-amber-400">0m 0s</span>
            </div>
        </div>

        <!-- Leader / Winner / Podium / Loser Summary Section -->
        <div class="bg-gradient-to-r from-amber-500/15 via-blue-900/40 to-amber-500/15 border gold-border rounded-2xl p-3 text-center shadow-lg space-y-2.5">
            <div>
                <div class="text-[11px] font-bold text-amber-300 uppercase tracking-wide flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-crown text-amber-400"></i> ഒന്നാം സ്ഥാനക്കാർ (Undefeated Champions)
                </div>
                <div id="leader-text" class="text-sm sm:text-base font-black text-white mt-0.5">
                    ലോഡ് ചെയ്യുന്നു...
                </div>
            </div>

            <!-- 2nd Place & 3rd Place Vertical Bullet List -->
            <div id="podium-text" class="text-xs text-amber-200/90 font-medium pt-1.5 border-t border-amber-500/20 px-1 text-left space-y-1">
                <div>🥈 2-ാം സ്ഥാനം കണക്കാക്കുന്നു...</div>
            </div>

            <!-- Fastest Win Award Section -->
            <div id="fastest-win-text" class="text-xs text-cyan-300 font-bold pt-1.5 border-t border-cyan-500/20 truncate px-1 text-center">
                ⚡ Fastest Win Award: കണക്കാക്കുന്നു...
            </div>

            <!-- തോറ്റ ടീം വിമർശന ഭാഗം -->
            <div id="loser-text" class="text-xs text-rose-300 font-semibold pt-1.5 border-t border-rose-500/20 text-center">
                തോറ്റ ടീമിനെ കണ്ടെത്തുന്നു...
            </div>
        </div>

        <!-- Separate Reset & WhatsApp Share Buttons -->
        <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="resetScores()" class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-slate-300 font-bold py-3 px-3 rounded-xl border border-slate-700/80 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 shadow-md">
                <i class="fa-solid fa-rotate-right text-slate-400"></i> റീസെറ്റ് (Reset)
            </button>
            <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-3 px-3 rounded-xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 text-xs transition-all active:scale-95 border border-emerald-400/30">
                <i class="fa-brands fa-whatsapp text-sm text-emerald-100"></i> വാട്സ്ആപ്പിൽ ഷെയർ
            </button>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-full text-xs shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        സ്കോർ അപ്ഡേറ്റ് ചെയ്തു!
    </div>

    <script>
        const ADMIN_PIN = "1234"; 

        const defaultTeams = [
            { id: 1, name: "Shafeer & Faisal", wins: 0, badgeBg: "bg-amber-500", lastMatchTime: 0, lastClickTime: 0 },
            { id: 2, name: "Musthafa & Junaid", wins: 0, badgeBg: "bg-blue-600", lastMatchTime: 0, lastClickTime: 0 },
            { id: 3, name: "Ashraf & Anwar", wins: 0, badgeBg: "bg-emerald-600", lastMatchTime: 0, lastClickTime: 0 },
            { id: 4, name: "Aneesh & Anas", wins: 0, badgeBg: "bg-rose-600", lastMatchTime: 0, lastClickTime: 0 },
            { id: 5, name: "Fahad & Mujeeb", wins: 0, badgeBg: "bg-purple-600", lastMatchTime: 0, lastClickTime: 0 }
        ];

        let teams = [];
        let tournamentStartTimestamp = null;
        let lastActionTimestamp = null;
        let timerInterval = null;
        let cooldownInterval = null;

        const firebaseConfig = {
            databaseURL: "https://west-smash-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('wesma_badminton_scores_v3');

        function initData() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const savedTeams = data.teams || defaultTeams;
                    teams = defaultTeams.map((defTeam, i) => {
                        const found = savedTeams.find(st => st.id === defTeam.id);
                        return {
                            ...defTeam,
                            name: (found && found.name) ? found.name : defTeam.name,
                            wins: found ? (found.wins || 0) : 0,
                            lastMatchTime: found ? (found.lastMatchTime || 0) : 0,
                            lastClickTime: found ? (found.lastClickTime || 0) : 0
                        };
                    });
                    tournamentStartTimestamp = data.tournamentStartTimestamp || null;
                    lastActionTimestamp = data.lastActionTimestamp || null;
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    tournamentStartTimestamp = null;
                    lastActionTimestamp = null;
                    dbRef.set({ teams, tournamentStartTimestamp, lastActionTimestamp });
                }
                render();
                startLiveTimer();
                startCooldownTickers();
            }, (error) => {
                console.error("Firebase read error:", error);
                const saved = localStorage.getItem("wesma_badminton_scores_v3");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        const savedTeams = parsed.teams || defaultTeams;
                        teams = defaultTeams.map((defTeam, i) => {
                            const found = savedTeams.find(st => st.id === defTeam.id);
                            return {
                                ...defTeam,
                                name: (found && found.name) ? found.name : defTeam.name,
                                wins: found ? (found.wins || 0) : 0,
                                lastMatchTime: found ? (found.lastMatchTime || 0) : 0,
                                lastClickTime: found ? (found.lastClickTime || 0) : 0
                            };
                        });
                        tournamentStartTimestamp = parsed.tournamentStartTimestamp || null;
                        lastActionTimestamp = parsed.lastActionTimestamp || null;
                    } catch(e) { 
                        teams = JSON.parse(JSON.stringify(defaultTeams)); 
                        tournamentStartTimestamp = null;
                        lastActionTimestamp = null;
                    }
                } else {
                    teams = JSON.parse(JSON.stringify(defaultTeams));
                    tournamentStartTimestamp = null;
                    lastActionTimestamp = null;
                }
                render();
                startLiveTimer();
                startCooldownTickers();
            });
        }

        function calculateTotalPlays() {
            return teams.reduce((sum, team) => sum + team.wins, 0);
        }

        function saveData() {
            dbRef.set({ teams, tournamentStartTimestamp, lastActionTimestamp }).catch((error) => {
                console.error("Firebase write error:", error);
                localStorage.setItem("wesma_badminton_scores_v3", JSON.stringify({ teams, tournamentStartTimestamp, lastActionTimestamp }));
            });
            updateLeaderboard();
        }

        function startFirstMatch() {
            const now = Date.now();
            if (!tournamentStartTimestamp) {
                tournamentStartTimestamp = now;
            }
            lastActionTimestamp = now;
            saveData();
            showToast("Tournament & Match timers started!");
        }

        function startLiveTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const currentTimerEl = document.getElementById("current-match-timer");
                const totalDurationEl = document.getElementById("total-duration-timer");
                const startBtn = document.getElementById("start-match-btn");

                if (!tournamentStartTimestamp) {
                    currentTimerEl.textContent = "0m 0s";
                    totalDurationEl.textContent = "0m 0s";
                    startBtn.classList.remove("hidden");
                    return;
                }
                
                startBtn.classList.add("hidden");
                
                // Total Tournament Duration
                const totalDiffMs = Date.now() - tournamentStartTimestamp;
                const totalMins = Math.floor(totalDiffMs / 60000);
                const totalSecs = Math.floor((totalDiffMs % 60000) / 1000);
                totalDurationEl.textContent = `${totalMins}m ${totalSecs}s`;

                // Current Match Duration
                if (lastActionTimestamp) {
                    const matchDiffMs = Date.now() - lastActionTimestamp;
                    const matchMins = Math.floor(matchDiffMs / 60000);
                    const matchSecs = Math.floor((matchDiffMs % 60000) / 1000);
                    currentTimerEl.textContent = `${matchMins}m ${matchSecs}s`;
                } else {
                    currentTimerEl.textContent = "0m 0s";
                }
            }, 1000);
        }

        function startCooldownTickers() {
            if (cooldownInterval) clearInterval(cooldownInterval);

            cooldownInterval = setInterval(() => {
                const now = Date.now();
                teams.forEach((team) => {
                    const btn = document.getElementById(`plus-btn-${team.id}`);
                    const overlay = document.getElementById(`spinner-overlay-${team.id}`);
                    if (!btn || !overlay) return;

                    const diff = now - (team.lastClickTime || 0);
                    if (diff < 60000) {
                        btn.disabled = true;
                        btn.classList.add("opacity-60", "cursor-not-allowed");
                        overlay.classList.remove("hidden");
                    } else {
                        btn.disabled = false;
                        btn.classList.remove("opacity-60", "cursor-not-allowed");
                        overlay.classList.add("hidden");
                    }
                });
            }, 500);
        }

        function render() {
            const container = document.getElementById("teams-list");
            container.innerHTML = "";

            let sortedTeams = [...teams].sort((a, b) => b.wins - a.wins);
            const now = Date.now();

            sortedTeams.forEach((team) => {
                const diff = now - (team.lastClickTime || 0);
                const inCooldown = diff < 60000;

                const card = document.createElement("div");
                card.className = "bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-2.5 flex flex-col shadow-md gap-1.5";

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <span class="w-2.5 h-8 rounded-lg ${team.badgeBg} shrink-0 shadow-sm"></span>
                            <input type="text" 
                                   value="${escapeHtml(team.name)}" 
                                   onchange="updateTeamName(${team.id}, this.value)"
                                   class="bg-transparent text-sm sm:text-base font-extrabold text-slate-100 focus:bg-slate-800 focus:px-2 focus:py-1 focus:rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-400 w-full truncate border-b border-dashed border-slate-700"
                                   placeholder="ടീം പേര്">
                        </div>

                        <div class="flex items-center gap-1.5 shrink-0">
                            <!-- Minus Button with Admin PIN -->
                            <button onclick="handleScoreChange(${team.id}, -1)" 
                                    class="w-8 h-11 bg-rose-950/80 hover:bg-rose-900 active:bg-rose-950 text-rose-300 rounded-xl flex items-center justify-center font-bold text-xs shadow-md active:scale-95 transition-all border border-rose-800/50"
                                    title="Decrease score (Admin PIN required)">
                                <i class="fa-solid fa-minus"></i>
                            </button>

                            <div id="score-box-${team.id}"
                                 class="w-12 h-11 bg-slate-950 rounded-xl flex items-center justify-center font-black text-lg text-amber-400 border border-amber-500/40 shadow-inner font-poppins">
                                ${team.wins}
                            </div>

                            <!-- Plus Button with Spinner Indicator -->
                            <div class="relative">
                                <button id="plus-btn-${team.id}" 
                                        onclick="handleScoreChange(${team.id}, 1)" 
                                        class="w-10 h-11 bg-emerald-700 hover:bg-emerald-600 active:bg-emerald-800 text-white rounded-xl flex items-center justify-center font-bold text-xs shadow-md active:scale-95 transition-all border border-emerald-500/50 ${inCooldown ? 'opacity-60 cursor-not-allowed' : ''}"
                                        ${inCooldown ? 'disabled' : ''}
                                        title="Add Win">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                                <!-- Visual Spinner Overlay for Cooldown -->
                                <div id="spinner-overlay-${team.id}" class="absolute inset-0 bg-slate-950/80 rounded-xl flex items-center justify-center ${inCooldown ? '' : 'hidden'} pointer-events-none">
                                    <i class="fa-solid fa-spinner animate-spin text-amber-400 text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Match Time Indicator -->
                    <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-800/60 px-1 font-poppins mt-2">
                        <span class="flex items-center gap-1"><i class="fa-regular fa-clock text-amber-400"></i> Last Match Duration:</span>
                        <span class="font-bold text-amber-300">${team.lastMatchTime ? team.lastMatchTime + ' mins' : 'Not recorded'}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("total-play-val").textContent = calculateTotalPlays();
            updateLeaderboard();
        }

        function handleScoreChange(id, delta) {
            const team = teams.find(t => t.id === id);
            if (!team) return;

            const now = Date.now();

            if (delta > 0) {
                if (team.lastClickTime && (now - team.lastClickTime < 60000)) {
                    showToast(`⚠️ Please wait before adding again!`);
                    return;
                }
                team.lastClickTime = now;

                if (!tournamentStartTimestamp) {
                    tournamentStartTimestamp = now;
                }

                if (lastActionTimestamp) {
                    const durationMinutes = Math.round((now - lastActionTimestamp) / 60000);
                    team.lastMatchTime = durationMinutes > 0 ? durationMinutes : 1;
                }
                lastActionTimestamp = now;

                team.wins += delta;
                saveData();
                render();
                showToast(`${team.name} വിജയം വിജയകരമായി ചേർത്തു! 🏸`);
            } 
            else if (delta < 0) {
                const pin = prompt("സ്കോർ കുറയ്ക്കുന്നതിന് Admin PIN (1234) നൽകുക:");
                if (pin !== ADMIN_PIN) {
                    if (pin !== null) alert("തെറ്റായ PIN!");
                    return;
                }

                if (team.wins + delta < 0) return;

                team.wins += delta;
                saveData();
                render();
                showToast(`${team.name} സ്കോർ അഡ്മിൻ വഴി തിരുത്തി!`);
            }
        }

        function updateTeamName(id, val) {
            const team = teams.find(t => t.id === id);
            if (!team) return;
            const trimmed = val.trim();
            team.name = trimmed !== "" ? trimmed : `Team`;
            saveData();
        }

        function updateLeaderboard() {
            const leaderEl = document.getElementById("leader-text");
            const podiumEl = document.getElementById("podium-text");
            const fastestEl = document.getElementById("fastest-win-text");
            const loserEl = document.getElementById("loser-text");

            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            if (maxWins === 0) {
                leaderEl.innerHTML = `<span class="text-slate-400 text-xs font-semibold">കളികൾ തുടങ്ങിയിട്ടില്ല</span>`;
                podiumEl.innerHTML = `<div>🥈 2-ാം സ്ഥാനം കണക്കാക്കുന്നു...</div>`;
                fastestEl.innerHTML = `⚡ Fastest Win Award: കളികൾക്ക് ശേഷം ലഭ്യമാകും`;
                loserEl.innerHTML = `തോറ്റ ടീമിനെ കണ്ടെത്തുന്നു...`;
                return;
            }

            const firstPlaces = sorted.filter(t => t.wins === maxWins);
            let leaderHtml = "";
            firstPlaces.forEach(f => {
                leaderHtml += `<div class="text-amber-300 font-black text-base">⭐ ${escapeHtml(f.name)} (${maxWins} ജയം) ⭐</div>`;
            });
            leaderHtml += `<div class="text-[11px] text-amber-400 font-bold mt-0.5">🌟 അൺഡിഫീറ്റഡ് ചാമ്പ്യൻസ് & മാസ്റ്റർ സ്മാഷേഴ്സ്! 🌟</div>`;
            leaderEl.innerHTML = leaderHtml;

            let distinctScores = [...new Set(sorted.map(t => t.wins))].filter(w => w < maxWins);
            
            let podiumHtml = "";
            let medals = ["🥈", "🥉", "🏅"];
            let labels = ["2-ാം സ്ഥാനം", "3-ാം സ്ഥാനം", "4-ാം സ്ഥാനം"];

            if (distinctScores.length > 0) {
                distinctScores.slice(0, 2).forEach((scoreVal, idx) => {
                    let matchingTeams = sorted.filter(t => t.wins === scoreVal);
                    podiumHtml += `<div class="font-semibold text-amber-200">${medals[idx]} ${labels[idx]}: <span class="text-white">${matchingTeams.map(t => escapeHtml(t.name)).join(" • ")}</span> (${scoreVal} ജയം)</div>`;
                });
            } else {
                podiumHtml = `<div class="text-amber-200/80 text-center">മറ്റ് ടീമുകൾക്ക് ഒപ്പത്തിനൊപ്പം പോരാട്ടം!</div>`;
            }
            podiumEl.innerHTML = podiumHtml;

            const teamsWithTime = teams.filter(t => t.wins > 0 && t.lastMatchTime > 0);
            if (teamsWithTime.length > 0) {
                teamsWithTime.sort((a, b) => a.lastMatchTime - b.lastMatchTime);
                const fastestTeam = teamsWithTime[0];
                fastestEl.innerHTML = `⚡ Fastest Win Award: <span class="text-cyan-200 font-black">${escapeHtml(fastestTeam.name)}</span> (${fastestTeam.lastMatchTime} mins)`;
            } else {
                fastestEl.innerHTML = `⚡ Fastest Win Award: കളികൾക്ക് ശേഷം ലഭ്യമാകും`;
            }

            const lowestTeams = sorted.filter(t => t.wins === minWins);
            if (lowestTeams.length > 0 && minWins < maxWins) {
                loserEl.innerHTML = `🚨 തോറ്റ ടീം: <span class="font-bold text-rose-200">${lowestTeams.map(l => escapeHtml(l.name)).join(" • ")}</span> (${minWins} ജയം) <br><span class="text-[10px] italic text-rose-400 font-normal">"ഇനിയും കഠിനാധ്വാനവും പ്രാക്ടീസും അത്യാവശ്യമാണ്! ഘടനാപരമായ പോരാട്ടം തുടരുക! 🏸💥"</span>`;
            } else {
                loserEl.innerHTML = `മത്സരം കടുത്ത പോരാട്ടത്തിൽ!`;
            }
        }

        function resetScores() {
            const inputPin = prompt("ടൂർണമെന്റ് റീസെറ്റ് ചെയ്യുന്നതിന് Admin PIN (1234) നൽകുക:");
            if (inputPin !== ADMIN_PIN) {
                if (inputPin !== null) alert("തെറ്റായ PIN!");
                return;
            }
            if (window.confirm("സ്കോറുകളും, ടോട്ടൽ പ്ലേയും, ടൈമറുകളും റീസെറ്റ് ചെയ്യണോ? (ടീം പേരുകൾ മാറില്ല)")) {
                teams.forEach(t => {
                    t.wins = 0;
                    t.lastMatchTime = 0;
                    t.lastClickTime = 0;
                });
                tournamentStartTimestamp = null;
                lastActionTimestamp = null;
                saveData();
                render();
                showToast("സ്കോറുകൾ റീസെറ്റ് ചെയ്തു (പേരുകൾ സുരക്ഷിതം)! നന്ദി.");
            }
        }

        function shareWhatsApp() {
            let sorted = [...teams].sort((a, b) => b.wins - a.wins);
            const maxWins = sorted[0].wins;
            const minWins = sorted[sorted.length - 1].wins;

            let msg = "🏸 *WESMA BADMINTON CLUB* 🏸\n";
            msg += "🏆 *Tournament Score Counter* 🏆\n\n";

            sorted.forEach((t, i) => {
                let timeStr = t.lastMatchTime ? ` (${t.lastMatchTime} mins)` : '';
                msg += `${i + 1}. ${t.name} : *${t.wins}* ജയം${timeStr}\n`;
            });

            msg += `\n🎮 *Total Plays:* ${calculateTotalPlays()}\n`;
            
            if (tournamentStartTimestamp) {
                let totalDiffMs = Date.now() - tournamentStartTimestamp;
                let totalMins = Math.floor(totalDiffMs / 60000);
                msg += `⏱️ *Total Duration:* ${totalMins} mins\n`;
            }

            msg += "-------------------------\n";

            const firstPlaces = sorted.filter(t => t.wins === maxWins && maxWins > 0);
            if (firstPlaces.length > 0) {
                msg += `👑 *1st Place (ചാമ്പ്യന്മാർ):* ${firstPlaces.map(f => f.name).join(" • ")} (${maxWins} ജയം)\n`;
            }

            let distinctScores = [...new Set(sorted.map(t => t.wins))].filter(w => w < maxWins);
            let medalsList = ["🥈 *2nd Place*", "🥉 *3rd Place*"];
            if (distinctScores.length > 0) {
                distinctScores.slice(0, 2).forEach((scoreVal, idx) => {
                    let matchingTeams = sorted.filter(t => t.wins === scoreVal);
                    msg += `${medalsList[idx]}: ${matchingTeams.map(t => t.name).join(" • ")} (${scoreVal} ജയം)\n`;
                });
            }

            let teamsWithTime = teams.filter(t => t.wins > 0 && t.lastMatchTime > 0);
            if (teamsWithTime.length > 0) {
                teamsWithTime.sort((a, b) => a.lastMatchTime - b.lastMatchTime);
                msg += `⚡ *Fastest Win Award:* ${teamsWithTime[0].name} (${teamsWithTime[0].lastMatchTime} mins)\n`;
            }

            const lowestTeams = sorted.filter(t => t.wins === minWins && minWins < maxWins);
            if (lowestTeams.length > 0) {
                msg += `🚨 *Critical Note:* ${lowestTeams.map(l => l.name).join(" • ")} needs practice! (${minWins} ജയം)\n`;
            }

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            toast.textContent = text;
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Start App
        initData();
    </script>
</body>
</html>
